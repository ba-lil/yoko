<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Hexa Stack HD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #12131C;
            --card-bg: #1C1D2A;
            --accent-color: #FFD700;
            --text-color: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            width: 100vw;
        }

        header {
            width: 100%;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 10;
        }

        .score-container {
            display: flex;
            flex-direction: column;
        }

        .score-title {
            font-size: 11px;
            color: #A0A0AB;
            letter-spacing: 1px;
        }

        .score-val {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent-color);
        }

        .btn-restart {
            background: #FF3B30;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.35);
        }

        #game-container {
            flex: 1;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div class="score-container">
            <span class="score-title">النقاط</span>
            <span id="score" class="score-val">0</span>
        </div>
        <button class="btn-restart" onclick="restartGame()">إعادة</button>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function triggerHaptic(style = 'light') {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred(style);
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration = 0.1) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // ألوان مشبعة وجذابة مثل اللعبة الأصلية
        const COLORS = {
            red: { top: '#FF5E57', side: '#D63031' },
            blue: { top: '#0ABDE3', side: '#0097E6' },
            green: { top: '#1DD1A1', side: '#10AC84' },
            yellow: { top: '#FECA57', side: '#FF9F43' },
            purple: { top: '#5F27CD', side: '#341F97' },
            orange: { top: '#FF9F1A', side: '#E67E22' }
        };
        const COLOR_KEYS = Object.keys(COLORS);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, hexRadius, dpr;

        // مضاعفة أبعاد الـ Canvas لمنع أي ضبابية HD Rendering
        function resize() {
            const container = document.getElementById('game-container');
            width = container.clientWidth;
            height = container.clientHeight;
            dpr = Math.max(window.devicePixelRatio || 1, 2); // 2x على الأقل لضمان حدة الرسومات

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            
            ctx.resetTransform();
            ctx.scale(dpr, dpr);
            hexRadius = Math.min(width, height) / 8.5;
        }

        const gridRadius = 2;
        let grid = [];

        function initGrid() {
            grid = [];
            for (let q = -gridRadius; q <= gridRadius; q++) {
                let r1 = Math.max(-gridRadius, -q - gridRadius);
                let r2 = Math.min(gridRadius, -q + gridRadius);
                for (let r = r1; r <= r2; r++) {
                    const pos = hexToPixel(q, r);
                    grid.push({ q, r, x: pos.x, y: pos.y, stack: [] });
                }
            }
        }

        function hexToPixel(q, r) {
            const centerX = width / 2;
            const centerY = height / 2 - 30;
            const x = centerX + hexRadius * (Math.sqrt(3) * q + Math.sqrt(3)/2 * r);
            const y = centerY + hexRadius * (3/2 * r);
            return { x, y };
        }

        let spawnSlots = [null, null, null];
        let draggingSlotIndex = -1;
        let dragPos = { x: 0, y: 0 };

        function generateStack() {
            const stackSize = Math.floor(Math.random() * 4) + 3;
            const numColors = Math.random() > 0.5 ? 2 : 1;
            const chosenColors = [];
            for (let i = 0; i < numColors; i++) {
                chosenColors.push(COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)]);
            }
            const stack = [];
            for (let i = 0; i < stackSize; i++) {
                stack.push(chosenColors[i % numColors]);
            }
            return stack;
        }

        function refillSlots() {
            if (spawnSlots.every(s => s === null)) {
                for (let i = 0; i < 3; i++) {
                    spawnSlots[i] = generateStack();
                }
            }
        }

        // رسم سداسي مع ظلال وحواف ثلاثية الأبعاد احترافية
        function drawHexTile(x, y, radius, colorObj, offset = 0) {
            const py = y - offset;
            
            // 1. رسم الظل السفلي للقطعة
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i + (Math.PI / 6);
                const hx = x + radius * Math.cos(angle);
                const hy = py + 6 + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.fillStyle = colorObj.side;
            ctx.fill();

            // 2. رسم السطح العلوي
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i + (Math.PI / 6);
                const hx = x + radius * Math.cos(angle);
                const hy = py + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.fillStyle = colorObj.top;
            ctx.fill();

            // إضاءة الحواف (Highlighting)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function drawEmptyHex(x, y, radius) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i + (Math.PI / 6);
                const hx = x + radius * Math.cos(angle);
                const hy = y + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.fillStyle = '#181A26';
            ctx.fill();
            ctx.strokeStyle = '#282B3D';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawStack(x, y, stack, radius) {
            for (let i = 0; i < stack.length; i++) {
                drawHexTile(x, y, radius, COLORS[stack[i]], i * 7);
            }
        }

        let score = 0;

        function render() {
            ctx.clearRect(0, 0, width, height);

            // شبكة اللعب
            grid.forEach(cell => {
                drawEmptyHex(cell.x, cell.y, hexRadius * 0.95);
                if (cell.stack.length > 0) {
                    drawStack(cell.x, cell.y, cell.stack, hexRadius * 0.9);
                }
            });

            // منطقة السحب المتاحة في الأسفل
            const slotY = height - 90;
            const slotSpacing = width / 4;

            for (let i = 0; i < 3; i++) {
                const slotX = slotSpacing * (i + 1);
                drawEmptyHex(slotX, slotY, hexRadius * 0.7);

                if (spawnSlots[i] && i !== draggingSlotIndex) {
                    drawStack(slotX, slotY, spawnSlots[i], hexRadius * 0.65);
                }
            }

            // رسم القطعة المسحوبة
            if (draggingSlotIndex !== -1 && spawnSlots[draggingSlotIndex]) {
                drawStack(dragPos.x, dragPos.y - 40, spawnSlots[draggingSlotIndex], hexRadius * 0.85);
            }

            requestAnimationFrame(render);
        }

        function checkAndMerge() {
            let mergedAny = false;

            grid.forEach(cell => {
                if (cell.stack.length === 0) return;

                const neighbors = grid.filter(n => {
                    const dq = Math.abs(n.q - cell.q);
                    const dr = Math.abs(n.r - cell.r);
                    const ds = Math.abs((-n.q - n.r) - (-cell.q - cell.r));
                    return (dq + dr + ds) === 2 && n.stack.length > 0;
                });

                const topColor = cell.stack[cell.stack.length - 1];

                neighbors.forEach(n => {
                    if (n.stack[n.stack.length - 1] === topColor) {
                        while (n.stack.length > 0 && n.stack[n.stack.length - 1] === topColor) {
                            cell.stack.push(n.stack.pop());
                            mergedAny = true;
                            score += 10;
                            document.getElementById('score').innerText = score;
                        }
                    }
                });

                if (cell.stack.length >= 10) {
                    cell.stack = [];
                    score += 200;
                    document.getElementById('score').innerText = score;
                    playSound(600, 0.2);
                    triggerHaptic('heavy');
                }
            });

            if (mergedAny) {
                playSound(480, 0.1);
                triggerHaptic('medium');
                setTimeout(checkAndMerge, 220);
            }
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function onPointerDown(e) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const pos = getPointerPos(e);
            const slotY = height - 90;
            const slotSpacing = width / 4;

            for (let i = 0; i < 3; i++) {
                if (spawnSlots[i]) {
                    const slotX = slotSpacing * (i + 1);
                    if (Math.hypot(pos.x - slotX, pos.y - slotY) < hexRadius) {
                        draggingSlotIndex = i;
                        dragPos = pos;
                        triggerHaptic('light');
                        break;
                    }
                }
            }
        }

        function onPointerMove(e) {
            if (draggingSlotIndex === -1) return;
            dragPos = getPointerPos(e);
        }

        function onPointerUp() {
            if (draggingSlotIndex === -1) return;

            let closestCell = null;
            let minDist = hexRadius * 1.2;

            grid.forEach(cell => {
                const dist = Math.hypot(dragPos.x - cell.x, (dragPos.y - 40) - cell.y);
                if (dist < minDist) {
                    minDist = dist;
                    closestCell = cell;
                }
            });

            if (closestCell && closestCell.stack.length === 0) {
                closestCell.stack = [...spawnSlots[draggingSlotIndex]];
                spawnSlots[draggingSlotIndex] = null;
                playSound(320, 0.08);
                triggerHaptic('light');

                setTimeout(checkAndMerge, 150);
                refillSlots();
            }

            draggingSlotIndex = -1;
        }

        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        function restartGame() {
            score = 0;
            document.getElementById('score').innerText = score;
            initGrid();
            spawnSlots = [null, null, null];
            refillSlots();
            triggerHaptic('warning');
        }

        window.addEventListener('resize', resize);
        resize();
        initGrid();
        refillSlots();
        requestAnimationFrame(render);
    </script>
</body>
</html>
